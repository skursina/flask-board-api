name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flask_ads_db
          POSTGRES_USER: flask_user
          POSTGRES_PASSWORD: flask_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flask_user -d flask_ads_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://flask_user:flask_password@localhost:5432/flask_ads_db
          SECRET_KEY: test-secret-key
        run: |
          pytest

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            cd ${{ secrets.SERVER_PATH }}

            git pull origin main

            docker compose up -d --build

            echo "Waiting for web container to become healthy..."

            for i in {1..12}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' flask_ads_api)

              echo "Health status: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo "Application is healthy."
                break
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "Application is unhealthy."
                docker compose logs --tail=50 web
                exit 1
              fi

              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "Healthcheck timeout."
              docker compose logs --tail=50 web
              exit 1
            fi

            docker compose ps